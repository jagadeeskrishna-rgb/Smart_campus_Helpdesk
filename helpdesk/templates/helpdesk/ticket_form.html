{% extends 'base.html' %}
{% block content %}
<div class="panel">
  <h1 class="h3 mb-3">{{ title }}</h1>
  <form method="post" enctype="multipart/form-data" class="vstack gap-3">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary align-self-start">Submit Ticket</button>
  </form>
</div>
{% endblock %}
