{% extends 'base.html' %}
{% block title %}Login - Smart Campus Helpdesk{% endblock %}
{% block content %}
<div class="auth-panel mx-auto">
  <h1 class="h3 mb-3">Login</h1>
  <form method="post" class="vstack gap-3">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary">Login</button>
  </form>
  <p class="mt-3 mb-0">New student? <a href="{% url 'register' %}">Create an account</a></p>
</div>
{% endblock %}
